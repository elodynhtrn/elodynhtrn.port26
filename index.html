<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio — Nhien Tran</title>
<style>
:root{--bg:#e8e3dc;--ink:#4a3f35;--soft:#8a7d70;--accent:#d4965a;--btn:rgba(74,63,53,.08);--btnh:rgba(74,63,53,.16);--shadow:0 18px 50px rgba(60,45,30,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b18;--ink:#efe9e1;--soft:#9a8e82;--btn:rgba(255,255,255,.08);--btnh:rgba(255,255,255,.18);--shadow:0 18px 50px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#1f1b18;--ink:#efe9e1;--soft:#9a8e82;--btn:rgba(255,255,255,.08);--btnh:rgba(255,255,255,.18);--shadow:0 18px 50px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px 0;touch-action:pan-y}
.book{position:relative;display:flex;aspect-ratio:32/9;width:min(calc(100vw - 112px),calc((100dvh - 96px) * 32 / 9));box-shadow:var(--shadow);background:#fafafa;border-radius:2px}
.book.one{aspect-ratio:16/9;width:min(calc(100vw - 112px),calc((100dvh - 96px) * 16 / 9))}
.book img,.book .ph{width:100%;height:100%;display:block;object-fit:contain;flex:1 1 0;min-width:0;background:#fafafa}
.book.two::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:6%;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(60,45,30,.16) 48%,rgba(60,45,30,.22) 50%,rgba(60,45,30,.16) 52%,transparent);pointer-events:none}
.ph{display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:14px;letter-spacing:.08em}
.nav{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--btn);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .2s,opacity .2s}
.nav:hover{background:var(--btnh)}
.nav:disabled{opacity:.25;cursor:default}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar{flex:none;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;letter-spacing:.14em;color:var(--soft)}
#bar b{color:var(--ink);font-weight:600}
#prog{width:min(320px,60vw);height:2px;background:var(--btn);border-radius:2px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media (hover:hover){.book img{cursor:zoom-in}}
#zv{position:fixed;inset:0;z-index:30;display:none;background:rgba(24,19,15,.94);overflow:hidden;touch-action:none;cursor:grab}
#zv.on{display:block}
#zv.g{cursor:grabbing}
#zi{position:absolute;left:50%;top:50%;max-width:94vw;max-height:88vh;transform:translate(-50%,-50%);will-change:transform;user-select:none;-webkit-user-drag:none;background:#fafafa}
#zt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;align-items:center;gap:4px;padding:4px;border-radius:99px;background:rgba(36,29,24,.88);color:#efe9e1;font-size:13px;letter-spacing:.08em;cursor:default;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#zt button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:20px;line-height:1;cursor:pointer}
#zt button:hover{background:rgba(255,255,255,.2)}
#zt span{min-width:48px;text-align:center}
html.v,html.v body{height:auto;overflow:visible}
html.v body{display:block}
html.v #stage,html.v #bar{display:none}
#scroll{display:none;flex-direction:column;gap:8px;padding:8px 6px calc(28px + env(safe-area-inset-bottom,0px))}
html.v #scroll{display:flex}
#scroll img{width:100%;aspect-ratio:16/9;display:block;background:#fafafa;box-shadow:var(--shadow)}
#pill{display:none;position:fixed;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--btnh);font-size:12px;letter-spacing:.12em;color:var(--ink);z-index:5}
html.v #pill{display:block}
@media (max-width:640px){#stage{gap:0;padding:8px 4px 0}.nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5}#pv{left:14px}#nx{right:14px}.book,.book.one{width:calc(100vw - 8px)}.book.one{aspect-ratio:16/9}}
</style>
</head>
<body>
<div id="stage">
  <button class="nav" id="pv" aria-label="Trang trước"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="book two" id="book"><div class="ph">PORTFOLIO</div></div>
  <button class="nav" id="nx" aria-label="Trang sau"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div id="zv"><img id="zi" alt="" draggable="false"><div id="zt"><button data-z="-" aria-label="Thu nhỏ">−</button><span id="zp">100%</span><button data-z="+" aria-label="Phóng to">+</button><button data-z="x" aria-label="Đóng">✕</button></div></div>
<div id="scroll"></div><div id="pill"></div>
<div id="bar"><div id="lbl"></div><div id="prog"><i></i></div></div>
<script>
(function(){
var BASE="";
var N=38,P=[],cur=0,narrow=false,book=document.getElementById('book');
function spreads(){var s=[],i;if(narrow){for(i=0;i<N;i++)s.push([i]);return s}s.push([0]);for(i=1;i<N;i+=2)s.push(i+1<N?[i,i+1]:[i]);return s}
function find(S,p){for(var i=0;i<S.length;i++)if(S[i].indexOf(p)>-1)return i;return 0}
function pad(n){return(n<10?'0':'')+n}
function show(dir){
  if(narrow)return;
  var S=spreads(),k=find(S,cur),sp=S[k];cur=sp[0];
  book.className='book '+(sp.length===2?'two':'one');
  book.innerHTML='';
  sp.forEach(function(i){var e;if(P[i]){e=new Image();e.src=P[i];e.alt='Trang '+(i+1);e.draggable=false}else{e=document.createElement('div');e.className='ph';e.textContent='ĐANG TẢI…'}book.appendChild(e)});
  document.getElementById('lbl').innerHTML='<b>'+sp.map(function(i){return pad(i+1)}).join(' – ')+'</b> / '+N;
  document.querySelector('#prog i').style.width=((sp[sp.length-1]+1)/N*100)+'%';
  document.getElementById('pv').disabled=k===0;document.getElementById('nx').disabled=k===S.length-1;
  if(dir&&book.animate)book.animate([{opacity:0,transform:'translateX('+dir*36+'px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.7,.2,1)'});
  [k-1,k+1].forEach(function(j){if(S[j])S[j].forEach(function(i){if(P[i])(new Image()).src=P[i]})});
  try{history.replaceState(null,'','#p'+(cur+1))}catch(e){}
}
function go(d){if(narrow)return;var S=spreads(),k=find(S,cur)+d;if(k<0||k>=S.length)return;cur=S[k][0];show(d)}
var sc=document.getElementById('scroll'),pill=document.getElementById('pill'),io=null;
function build(){if(io)return;var vis={};io=new IntersectionObserver(function(es){es.forEach(function(e){var i=+e.target.dataset.i;if(e.isIntersecting)vis[i]=1;else delete vis[i]});var k=Object.keys(vis).map(Number);if(!k.length)return;cur=Math.min.apply(null,k);pill.textContent=pad(cur+1)+' / '+N;try{history.replaceState(null,'','#p'+(cur+1))}catch(x){}},{threshold:.5});
  for(var i=0;i<N;i++){var m=new Image();m.src=P[i];m.alt='Trang '+(i+1);m.loading='lazy';m.decoding='async';m.draggable=false;m.dataset.i=i;sc.appendChild(m);io.observe(m)}}
function mode(){var n=innerWidth<760||innerWidth/innerHeight<1.05||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<700);if(n===narrow&&io!==null||n===narrow&&!n)return;
  narrow=n;document.documentElement.classList.toggle('v',n);
  if(n){build();var t=cur;requestAnimationFrame(function(){sc.children[t].scrollIntoView()})}else show(0)}
var zv=document.getElementById('zv'),zi=document.getElementById('zi'),zp=document.getElementById('zp'),Z={s:1,x:0,y:0,open:false},ptr={},drag=null,pd=0;
function zset(){zi.style.transform='translate(calc(-50% + '+Z.x+'px),calc(-50% + '+Z.y+'px)) scale('+Z.s+')';zp.textContent=Math.round(Z.s*100)+'%'}
function zat(px,py,ns){ns=Math.min(6,Math.max(1,ns));var cx=innerWidth/2,cy=innerHeight/2;Z.x=(px-cx)-(px-cx-Z.x)*ns/Z.s;Z.y=(py-cy)-(py-cy-Z.y)*ns/Z.s;Z.s=ns;
  if(ns<=1.001){Z.s=1;Z.x=Z.y=0}else{var bx=zi.offsetWidth*ns/2-60,by=zi.offsetHeight*ns/2-60;Z.x=Math.max(-bx,Math.min(bx,Z.x));Z.y=Math.max(-by,Math.min(by,Z.y))}zset()}
function zopen(src,fx,fy){zi.src=src;Z.s=1;Z.x=Z.y=0;Z.open=true;zv.classList.add('on');zset();
  requestAnimationFrame(function(){var s=2.4;Z.s=s;Z.x=-(fx-.5)*zi.offsetWidth*s;Z.y=-(fy-.5)*zi.offsetHeight*s;zat(innerWidth/2,innerHeight/2,s)})}
function zclose(){Z.open=false;zv.classList.remove('on');ptr={};drag=null}
book.addEventListener('click',function(e){var t=e.target;if(t.tagName!=='IMG')return;var r=t.getBoundingClientRect();zopen(t.src,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});
zv.addEventListener('wheel',function(e){e.preventDefault();zat(e.clientX,e.clientY,Z.s*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
zv.addEventListener('pointerdown',function(e){if(e.target.closest('#zt'))return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};drag={x:e.clientX,y:e.clientY,m:false,t:e.target};pd=0;zv.classList.add('g');try{zv.setPointerCapture(e.pointerId)}catch(x){}});
zv.addEventListener('pointermove',function(e){var p=ptr[e.pointerId];if(!p)return;var k=Object.keys(ptr);
  if(k.length===2){var a=ptr[k[0]],b=ptr[k[1]],d0=Math.hypot(a.x-b.x,a.y-b.y);p.x=e.clientX;p.y=e.clientY;var d1=Math.hypot(a.x-b.x,a.y-b.y);if(d0>0)zat((a.x+b.x)/2,(a.y+b.y)/2,Z.s*d1/d0);if(drag)drag.m=true;return}
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4)drag.m=true;if(Z.s>1){Z.x+=dx;Z.y+=dy;zat(innerWidth/2,innerHeight/2,Z.s)}});
function zup(e){delete ptr[e.pointerId];if(Object.keys(ptr).length)return;zv.classList.remove('g');if(drag&&!drag.m){if(drag.t===zi){if(Z.s>1)zat(e.clientX,e.clientY,1);else zat(e.clientX,e.clientY,2.4)}else zclose()}drag=null}
zv.addEventListener('pointerup',zup);zv.addEventListener('pointercancel',function(e){delete ptr[e.pointerId];drag=null;zv.classList.remove('g')});
document.getElementById('zt').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var c=b.dataset.z,mx=innerWidth/2,my=innerHeight/2;if(c==='x')zclose();else if(c==='+')zat(mx,my,Z.s*1.4);else zat(mx,my,Z.s/1.4)});
document.getElementById('pv').onclick=function(){go(-1)};
document.getElementById('nx').onclick=function(){go(1)};
addEventListener('keydown',function(e){if(Z.open){if(e.key==='Escape')zclose();else if(e.key==='+'||e.key==='=')zat(innerWidth/2,innerHeight/2,Z.s*1.3);else if(e.key==='-')zat(innerWidth/2,innerHeight/2,Z.s/1.3);return}if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);else if(e.key==='Home'){cur=0;show(-1)}else if(e.key==='End'){cur=N-1;show(1)}});
var x0=null,st=document.getElementById('stage');
st.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
st.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)go(dx<0?1:-1)},{passive:true});
addEventListener('resize',mode);
for(var q=0;q<N;q++)P[q]=BASE+(q<9?'0':'')+(q+1)+'.webp';
var m=/^#p(\d+)$/.exec(location.hash);if(m)cur=Math.min(N,Math.max(1,+m[1]))-1;
addEventListener('hashchange',function(){var m=/^#p(\d+)$/.exec(location.hash);if(m){cur=Math.min(N,Math.max(1,+m[1]))-1;if(narrow)sc.children[cur].scrollIntoView();else show(0)}});
mode();if(!narrow)show(0);
})();
</script>
</body>
</html>
